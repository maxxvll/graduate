server:
  port: 5050
  servlet:
    context-path: /api
    session:
      timeout: PT60M
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    threads:
      virtual:
        enabled: true
        max-count: 1000

spring:
  application:
    name: wx-chat
    server-id: ${SERVER_ID:default-server}

  # 配置文件激活（通过环境变量 SPRING_PROFILES_ACTIVE 设置）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  mvc:
    favicon:
      enabled: false
    throw-exception-if-no-handler-found: false
    contentnegotiation:
      favor-parameter: false
      ignore-accept-header: false
      default-content-type: application/json
      media-types:
        json: application/json
        xml: application/xml
        "*/*": application/json

  web:
    resources:
      add-mappings: true

  task:
    execution:
      thread-name-prefix: app-virtual-thread-
      virtual:
        enabled: true
    scheduling:
      thread-name-prefix: app-scheduler-virtual-thread-
      virtual:
        enabled: true

  # 邮件配置（在不同环境的yaml中覆盖）
  mail:
    host: smtp.qq.com
    username: ${MAIL_USERNAME:2057044770@qq.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.enable: true
      mail.smtp.port: 465
  cloud:
    refresh:
      enabled: true

# 应用配置
app:
  chat:
    message-retention-days: 15
    retention-cleanup-cron: 0 10 4 * * ?
  kafka:
    chat:
      consumer-mode: batch
    features:
      global-kafka-enabled: true
      email-async-enabled: true
      friend-notification-async-enabled: true
      audit-log-async-enabled: true
      group-notification-async-enabled: true
      file-upload-log-async-enabled: true
      message-recall-async-enabled: false
      user-profile-update-async-enabled: false
  permission:
    enabled: true
    cache-enabled: true
    cache-ttl-seconds: 300
  file:
    upload-path: /uploads
    access-url:
  voice-call:
    supported-transports:
      - webrtc
      - stream
    ice-servers:
      - urls:
          - ${VOICE_CALL_STUN_URL:stun:stun.l.google.com:19302}
        username: ${VOICE_CALL_STUN_USERNAME:}
        credential: ${VOICE_CALL_STUN_CREDENTIAL:}

  # ================================================
  # 告警配置
  # ================================================
  alert:
    enabled: true
    # 告警规则列表
    rules:
      # WebSocket连接数超限告警
      - name: WebSocket连接数超限
        metric: websocket.activeConnections
        threshold: 5000
        operator: GREATER_THAN
        severity: WARNING
        cooldown-seconds: 300
        enabled: true
      # 内存使用率过高告警
      - name: 内存使用率过高
        metric: jvm.heapUsagePercent
        threshold: 85
        operator: GREATER_THAN
        severity: WARNING
        cooldown-seconds: 180
        enabled: true
      # 内存严重过高告警
      - name: 内存使用率严重过高
        metric: jvm.heapUsagePercent
        threshold: 95
        operator: GREATER_THAN
        severity: CRITICAL
        cooldown-seconds: 300
        enabled: true
      # 消息延迟过高告警
      - name: 消息延迟过高
        metric: latency.avgMs
        threshold: 500
        operator: GREATER_THAN
        severity: WARNING
        cooldown-seconds: 120
        enabled: true
      # 线程数过多告警
      - name: 线程数过多
        metric: jvm.threadCount
        threshold: 500
        operator: GREATER_THAN
        severity: WARNING
        cooldown-seconds: 300
        enabled: true
    # 告警通知渠道配置
    channels:
      - type: LOG
        enabled: true
      - type: EMAIL
        config: ${ALERT_EMAIL_CONFIG:}
        enabled: false
      - type: WEBHOOK
        config: ${ALERT_WEBHOOK_CONFIG:}
        enabled: false

# Elasticsearch配置（可选）
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  scheme: ${ELASTICSEARCH_SCHEME:http}

# MinIO配置（在不同环境的yaml中覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  default-bucket: file-storage-bucket
  avatar-bucket: chat-avatars-public
  upload:
    chunk-size: 5242880
    max-file-size: 104857600
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/bmp
      - image/webp
      - application/pdf
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - video/mp4
      - video/avi
      - video/mov
      - audio/mp3
      - audio/wav

# 管理端点配置（在不同环境的yaml中覆盖）
management:
  health:
    elasticsearch:
      enabled: false
    rabbitmq:
      enabled: false
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 日志配置（基础配置，profile中覆盖）
logging:
  level:
    root: warn
    com.maxxvll: info
    org.springframework.jdbc: warn
    org.springframework.data.redis: warn
    org.springframework.kafka: warn
    com.mysql.cj: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# DeepSeek API配置
deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    key: ${DEEPSEEK_API_KEY:}

# Sa-Token配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  jwt-secret-key: ${SA_TOKEN_SECRET_KEY:asdasdasifhwdsaavuihdfjskljfvbgwenkdvzhirzcxcfnijkxfnuskhjtmflkjvnjhksuejhfbh548~~~urfewbfjsdafjk}
  enabled: true
  allow-cross-origin: true
  allow-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5100}
  exclude-paths:
    - /favicon.ico
    - /user/login
    - /user/register
    - /user/check-username
    - /user/qrcode/generate
    - /user/qrcode/status
    - /user/sendEmailCode
    - /cloud/access/**
    - /test/**

# WebSocket配置
ws:
  host: 0.0.0.0
  port: ${WS_PORT:5051}
  auth:
    max-connections-per-user: 3
    max-connections-per-ip: 10
    connection-rate-limit: 10
    ip-whitelist:
      - "127.0.0.1"
      - "localhost"
    ip-blacklist: []
  heartbeat:
    reader-idle-time: 90
    writer-idle-time: 0
    all-idle-time: 30
    default-interval-ms: 30000
    min-interval-ms: 10000
    max-interval-ms: 120000
    stable-threshold: 5
    unstable-threshold: 3
    timeout-ms: 10000
    alert-threshold-ms: 5000
    consecutive-alert-threshold: 3
  batch:
    enabled: true
    max-batch-size: 50
    flush-interval-ms: 100
  compression:
    enabled: true
    min-size-bytes: 1024
    max-size-bytes: 10485760
    level: 6
  pending-message:
    max-cache-size: 10000
    expire-minutes: 30

# Netty配置
netty:
  boss-threads: 1
  worker-threads: 0

# ================================================
# Jasypt加密配置
# ================================================
# 加密后的配置使用 ENC(...) 包裹，例如：
# password: ENC(加密后的密文)
# 加密密钥通过环境变量或命令行参数传入：
# -Djasypt.encryptor.password=your-secret-key
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    password: ${JASYPT_ENCRYPTOR_PASSWORD:changeit}
    iv-generator-classname: org.jasypt.iv.NoIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    key-obfuscation: true
    string-output-type: base64

# ================================================
# 配置刷新端点
# ================================================
# 启用配置刷新功能后，可通过 POST /actuator/refresh 刷新配置

